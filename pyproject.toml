[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdbox"
version = "0.1.0"
description = "Tongdun 1.7.x black_box local transform and request-signing helpers (reverse-engineering study)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["reverse-engineering", "tongdun", "fraudmetrix", "device-fingerprint", "black-box"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
tdbox = "tdbox.cli:main"

[tool.setuptools]
packages = ["tdbox"]
